[workspace]
resolver = "3"
members = [
    "crates/logreel",
    "crates/logreel-core",
    "crates/logreel-derive",
    "crates/logreel-store",
    "crates/logreel-file",
    "crates/logreel-store-redb",
    "xtask",
    "bench/harness",
    "examples/events",
    "examples/quickstart",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/Kraionix/logreel"
authors = ["logreel contributors"]

[workspace.dependencies]
logreel-core = { path = "crates/logreel-core", version = "=0.1.0" }
logreel-derive = { path = "crates/logreel-derive", version = "=0.1.0" }
logreel-store = { path = "crates/logreel-store", version = "=0.1.0" }
logreel-file = { path = "crates/logreel-file", version = "=0.1.0" }
logreel-store-redb = { path = "crates/logreel-store-redb", version = "=0.1.0" }
logreel = { path = "crates/logreel", version = "=0.1.0" }

tokio = { version = "1.53", default-features = false, features = ["rt"] }
prost = "0.14.4"
redb = "4.3.0"
zstd = "0.14"
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
