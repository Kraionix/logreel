name: bench

on:
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - run: cargo xtask bench --write
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/RESULTS.md
